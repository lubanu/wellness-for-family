<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WelFamily - 1분 맞춤 복지 계산기 위젯</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Pretendard', -apple-system, sans-serif;
      margin: 0;
      padding: 12px;
      background: #f8fafc;
    }
  </style>
</head>
<body>
  <div class="max-w-md mx-auto bg-white border border-slate-200 rounded-2xl p-4 shadow-sm hover:shadow-md transition">
    <!-- Header -->
    <div class="flex items-center justify-between mb-3 pb-2 border-b border-slate-100">
      <div class="flex items-center space-x-2">
        <div class="w-6 h-6 rounded-md bg-blue-600 text-white flex items-center justify-center font-black text-xs">
          W
        </div>
        <span class="font-extrabold text-sm text-slate-900 tracking-tight">우리 가족 숨은 복지 1분 계산기</span>
      </div>
      <span class="text-[10px] font-bold px-2 py-0.5 bg-blue-50 text-blue-700 rounded-full">2026 공공데이터 연동</span>
    </div>

    <!-- Quick Controls -->
    <div class="grid grid-cols-2 gap-2 mb-3">
      <div>
        <label class="block text-[11px] font-bold text-slate-600 mb-1">거주 지역</label>
        <select id="widget-region" onchange="calculateWidget()" class="w-full p-1.5 bg-slate-50 border border-slate-200 rounded-lg text-xs font-semibold focus:ring-1 focus:ring-blue-500">
          <option value="seoul_gwanak">서울 관악구</option>
          <option value="gyeonggi_seongnam">경기 성남시</option>
          <option value="busan_haeundae">부산 해운대구</option>
        </select>
      </div>
      <div>
        <label class="block text-[11px] font-bold text-slate-600 mb-1">가구 형태</label>
        <select id="widget-family" onchange="calculateWidget()" class="w-full p-1.5 bg-slate-50 border border-slate-200 rounded-lg text-xs font-semibold focus:ring-1 focus:ring-blue-500">
          <option value="infant">영유아 신혼부부 (3인)</option>
          <option value="youth">청년 1인 가구</option>
          <option value="multi">다자녀·대가구 (5인+)</option>
        </select>
      </div>
    </div>

    <!-- Output Box -->
    <div class="bg-gradient-to-r from-blue-700 to-indigo-800 text-white rounded-xl p-3 mb-3">
      <span class="text-[11px] text-blue-200 block mb-0.5">우리 가족 예상 연간 지원금</span>
      <div class="flex items-baseline space-x-1">
        <span class="text-2xl font-black text-yellow-300" id="widget-amount">5,400,000</span>
        <span class="text-xs text-blue-100 font-semibold">원 / 년</span>
      </div>
      <div class="mt-1 flex items-center justify-between text-[11px] text-blue-100 pt-1.5 border-t border-white/10">
        <span id="widget-policy-count">총 8개 정책 조건 일치</span>
        <span class="text-yellow-300 font-bold" id="widget-local-tag">관악구 전용 4개 포함</span>
      </div>
    </div>

    <!-- Contextual Affiliate Deal Banner -->
    <div id="widget-deal-box" class="p-2.5 bg-amber-50/80 border border-amber-200 rounded-xl mb-3 text-xs">
      <div class="flex items-center justify-between mb-0.5">
        <span class="text-[10px] font-bold px-1.5 py-0.2 bg-amber-500 text-slate-950 rounded" id="widget-deal-badge">추천 혜택</span>
        <span class="text-[9px] text-slate-600">제휴</span>
      </div>
      <p class="font-bold text-slate-900 text-[11px]" id="widget-deal-title">👶 국민행복카드 신규 발급 시 15만 원 현금 캐시백</p>
      <span class="text-[10px] text-slate-500 block">바우처 필수 등록 카드 • 신규 가입 혜택</span>
    </div>

    <!-- CTA Button -->
    <a id="widget-cta-link" href="index.html?ref=widget" target="_blank" class="w-full py-2.5 bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs rounded-xl flex items-center justify-center space-x-1 transition shadow-sm">
      <span>구비서류 확인 및 1분 신청 가이드 보기</span>
      <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
    </a>

    <!-- Footer Attribution & AdSlot -->
    <div class="mt-2 text-center text-[10px] text-slate-400">
      제공: 웰패밀리(WelFamily) • 공정위 지침 준수 제휴 포함
    </div>
  </div>

  <script>
    function calculateWidget() {
      const reg = document.getElementById('widget-region').value;
      const fam = document.getElementById('widget-family').value;
      const amtEl = document.getElementById('widget-amount');
      const countEl = document.getElementById('widget-policy-count');
      const localEl = document.getElementById('widget-local-tag');
      const dealBadge = document.getElementById('widget-deal-badge');
      const dealTitle = document.getElementById('widget-deal-title');
      const ctaLink = document.getElementById('widget-cta-link');

      ctaLink.href = `index.html?region=${reg}&type=${fam}&ref=widget`;

      if (fam === 'infant') {
        amtEl.innerText = "5,400,000";
        countEl.innerText = "총 8개 정책 조건 일치";
        localEl.innerText = reg.includes('seoul') ? "관악구 전용 4개 포함" : (reg.includes('gyeonggi') ? "성남시 전용 4개 포함" : "부산시 전용 3개 포함");
        dealBadge.innerText = "바우처 필수";
        dealTitle.innerText = "👶 국민행복카드 신규 발급 시 15만 원 현금 캐시백";
      } else if (fam === 'youth') {
        amtEl.innerText = "2,800,000";
        countEl.innerText = "총 4개 정책 조건 일치";
        localEl.innerText = reg.includes('seoul') ? "이사비 40만원 포함" : "청년배당 100만원 포함";
        dealBadge.innerText = "이사 필수";
        dealTitle.innerText = "🏠 포장이사 무료 비교견적 + 인터넷 47만원 현금 사은품";
      } else {
        amtEl.innerText = "8,920,000";
        countEl.innerText = "총 12개 정책 조건 일치";
        localEl.innerText = "다자녀 축하금 포함";
        dealBadge.innerText = "수당 전용";
        dealTitle.innerText = "💰 연 4.0% 비대면 고금리 파킹통장 1분 개설";
      }
    }
    window.onload = function() {
      lucide.createIcons();
    };
  </script>
</body>
</html>
