name: "Deploy WelFamily to GitHub Pages"

# Manual only until the go-public gate (after P4).
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Prepare Static Artifacts
        run: |
          mkdir -p dist/data
          cp prototype/index.html dist/index.html
          cp data/welfare_catalog.json data/latest_sync.json dist/data/

      - name: Block Unfinished Content
        run: |
          if grep -rEn 'localhost|쿠팡|ca-pub|5,400,000|Care\+' dist; then
            echo "Unfinished content found in the deploy output."
            exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
