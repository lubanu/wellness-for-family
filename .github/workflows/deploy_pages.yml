name: "Deploy WelFamily to GitHub Pages"

on:
  push:
    branches: [ master, main ]
    paths:
      - 'prototype/**'
      - 'data/**'
      - '.github/workflows/deploy_pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Prepare Static Artifacts
        run: |
          mkdir -p dist/prototype
          cp prototype/index.html dist/index.html
          cp prototype/widget.html dist/widget.html
          cp prototype/index.html dist/prototype/index.html
          cp prototype/widget.html dist/prototype/widget.html
          cp -r data dist/data
          if [ -d "blog_posts" ]; then cp -r blog_posts dist/blog_posts; fi

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
